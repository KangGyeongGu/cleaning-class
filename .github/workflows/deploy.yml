# @file .github/workflows/deploy.yml
# @description main push 후 Docker 이미지 빌드·업로드 및 Lightsail 컨테이너 교체
# @activation CI: 원격 main 브랜치 push 시 GitHub Actions 자동 실행
# @activation 로컬 커밋·검사 명령·Agent Skill: 직접 실행 없음
# @activation 검증 단계: verify 실행 없음
name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cleaning-class-web:latest
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_NOMADLABS_URL=${{ secrets.NEXT_PUBLIC_NOMADLABS_URL }}
            NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_CLARITY_ID=${{ secrets.NEXT_PUBLIC_CLARITY_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            docker pull rudrn0110/cleaning-class-web:latest
            docker stop cleaning-class 2>/dev/null || true
            docker rm cleaning-class 2>/dev/null || true
            docker run -d \
              --name cleaning-class \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file ~/cleaning-class/.env \
              -v /home/ubuntu/traffic-data/goaccess:/data/goaccess:ro \
              -v /home/ubuntu/traffic-data/cloudflare:/data/cloudflare:rw \
              -v cleaning-class-img-cache:/app/.next/cache/images \
              rudrn0110/cleaning-class-web:latest
            docker image prune -f
